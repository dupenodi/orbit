<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Orbit app icon: the wheel, top slice selected, on a macOS icon-grid plate (824 at 100). -->
  <defs>
    <linearGradient id="plate" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a44a6"/>
      <stop offset="0.55" stop-color="#171c47"/>
      <stop offset="1" stop-color="#090b1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c89ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5a66e6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5a66e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="220" x2="0" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="220" x2="0" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="190" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="plate-clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)" filter="url(#shadow)"/>
  <g clip-path="url(#plate-clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <path d="M 624.3 264.3 A 272 272 0 0 1 759.7 399.7 L 641.3 448.7 A 144 144 0 0 0 575.3 382.7 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M 766.6 416.3 A 272 272 0 0 1 766.6 607.7 L 648.2 558.7 A 144 144 0 0 0 648.2 465.3 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M 759.7 624.3 A 272 272 0 0 1 624.3 759.7 L 575.3 641.3 A 144 144 0 0 0 641.3 575.3 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M 607.7 766.6 A 272 272 0 0 1 416.3 766.6 L 465.3 648.2 A 144 144 0 0 0 558.7 648.2 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M 399.7 759.7 A 272 272 0 0 1 264.3 624.3 L 382.7 575.3 A 144 144 0 0 0 448.7 641.3 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M 257.4 607.7 A 272 272 0 0 1 257.4 416.3 L 375.8 465.3 A 144 144 0 0 0 375.8 558.7 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M 264.3 399.7 A 272 272 0 0 1 399.7 264.3 L 448.7 382.7 A 144 144 0 0 0 382.7 448.7 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M 416.3 241.4 A 272 272 0 0 1 607.7 241.4 L 558.7 359.8 A 144 144 0 0 0 465.3 359.8 Z" fill="#aab6ff" opacity="0.7" filter="url(#halo)"/>
  <path d="M 416.3 241.4 A 272 272 0 0 1 607.7 241.4 L 558.7 359.8 A 144 144 0 0 0 465.3 359.8 Z" fill="url(#hot)"/>

  <circle cx="512" cy="512" r="112" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.26" stroke-width="2.5"/>
  <path d="M 476.8 395.2 A 122 122 0 0 1 547.2 395.2" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M 488 452 L 512 418 L 536 452 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
</svg>
