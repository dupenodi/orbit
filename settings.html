<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Orbit Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="group">
          <div class="row">
            <div class="row-text">
              <p class="label">Wheel shortcut</p>
              <p class="help" id="shortcut-help">Hold it anywhere to open the wheel.</p>
            </div>
            <button type="button" class="recorder" id="shortcut" aria-describedby="shortcut-help"></button>
          </div>
          <div class="row">
            <div class="row-text">
              <label class="label" for="login">Open at login</label>
            </div>
            <input id="login" class="switch" type="checkbox" role="switch" />
          </div>
        </div>
      </section>

      <section id="permissions-section">
        <h2>Permissions</h2>
        <div class="group" id="permissions" aria-live="polite"></div>
        <p class="note" id="permissions-note"></p>
      </section>
    </main>

    <footer>
      <p id="version">Orbit</p>
      <button type="button" class="link" id="guide">Welcome Guide…</button>
    </footer>
    <script src="shortcut.js"></script>
    <script src="shortcut-recorder.js"></script>
    <script type="module" src="settings.js"></script>
  </body>
</html>
