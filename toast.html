<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Orbit Toast</title>
    <link rel="stylesheet" href="toast.css" />
  </head>
  <body>
    <div id="toast" role="status" aria-live="polite">
      <div id="badge">
        <span id="icon"></span>
        <span id="status"></span>
      </div>
      <div id="text">
        <p id="title"></p>
        <p id="message"></p>
      </div>
    </div>
    <script type="module" src="toast-renderer.js"></script>
  </body>
</html>
